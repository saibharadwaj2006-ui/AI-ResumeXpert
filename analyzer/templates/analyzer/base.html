<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI ResumeXpert{% endblock %}</title>
    {% load static %}
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5046e5;
            --primary-light: #6d63f0;
            --accent: #06d6a0;
            --dark: #0f0e17;
            --surface: #1a1927;
            --surface-2: #252438;
            --text: #e8e6f0;
            --text-muted: #8b87a8;
            --border: #2e2c45;
            --danger: #f72585;
            --warning: #f4a261;
            --success: #06d6a0;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
        }
        
        /* ── Navbar ────────────────────────────────────────────────── */
        .navbar {
            background: rgba(15, 14, 23, 0.95) !important;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            padding: 1rem 0;
        }
        
        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text) !important;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
        
        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .nav-link:hover, .nav-link.active { color: var(--text) !important; }
        
        /* ── Cards ─────────────────────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text) !important;
        }
        .card, .card-body, .card-header, .card-footer, .card * {
            color: var(--text) !important;
        }
        
        .card-header {
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            border-radius: 16px 16px 0 0 !important;
            padding: 1.25rem 1.5rem;
        }
        
        /* ── Buttons ───────────────────────────────────────────────── */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border: none;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.6rem 1.5rem;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(80, 70, 229, 0.4);
        }
        
        .btn-outline-light {
            border-color: var(--border);
            color: var(--text-muted);
            border-radius: 10px;
        }
        
        .btn-outline-light:hover {
            background: var(--surface-2);
            color: var(--text);
            border-color: var(--primary);
        }
        
        /* ── Badges ────────────────────────────────────────────────── */
        .skill-badge {
            background: rgba(80, 70, 229, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(80, 70, 229, 0.3);
            border-radius: 6px;
            padding: 0.25rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
            margin: 2px;
        }
        
        /* ── Score Circle ──────────────────────────────────────────── */
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            position: relative;
        }
        
        .score-number {
            font-size: 2rem;
            line-height: 1;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .score-label { font-size: 0.7rem; color: var(--text-muted); }
        
        /* ── Progress Bars ─────────────────────────────────────────── */
        .progress {
            background: var(--surface-2);
            border-radius: 100px;
            height: 8px;
        }
        
        .progress-bar { border-radius: 100px; }
        
        /* ── Alerts ────────────────────────────────────────────────── */
        .alert {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: var(--text);
        }
        .alert-warning {
            background: rgba(244,162,97,0.18);
            border-color: rgba(244,162,97,0.35);
            color: #ffdcb0;
        }
        .alert-danger {
            background: rgba(247,37,133,0.18);
            border-color: rgba(247,37,133,0.35);
            color: #ffd1e8;
        }
        .alert-info {
            background: rgba(80,70,229,0.18);
            border-color: rgba(80,70,229,0.35);
            color: #d6daff;
        }
        
        .text-muted {
            color: rgba(232,230,240,0.72) !important;
        }

        .badge.bg-secondary {
            background: rgba(255,255,255,0.12) !important;
            color: #ffffff !important;
        }

        .btn-outline-light {
            border-color: rgba(255,255,255,0.18);
            color: #ffffff !important;
        }
        .btn-outline-light:hover {
            color: #ffffff !important;
        }
        
        /* ── Footer ────────────────────────────────────────────────── */
        footer {
            border-top: 1px solid var(--border);
            padding: 2rem 0;
            color: var(--text-muted);
            text-align: center;
            font-size: 0.85rem;
        }
        
        /* ── Monospace ─────────────────────────────────────────────── */
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* ── Utils ─────────────────────────────────────────────────── */
        .text-accent { color: var(--accent) !important; }
        .text-primary-custom { color: var(--primary-light) !important; }
        .bg-surface { background: var(--surface) !important; }
        .bg-surface-2 { background: var(--surface-2) !important; }
        .border-custom { border-color: var(--border) !important; }
        
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 2rem 0;
        }
        
        /* ── AI content formatting ─────────────────────────────────── */
        .ai-content h2, .ai-content h3 {
            color: var(--accent);
            font-size: 1rem;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .ai-content ul { padding-left: 1.5rem; }
        .ai-content li { margin-bottom: 0.3rem; color: var(--text-muted); }
        .ai-content strong { color: var(--text); }
        .ai-content p { color: var(--text-muted); }
        
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <div class="brand-icon">AI</div>
                AI ResumeXpert
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="bi bi-list text-light fs-5"></i>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
                            <i class="bi bi-house me-1"></i>Analyze
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}" href="{% url 'history' %}">
                            <i class="bi bi-clock-history me-1"></i>History
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div style="padding-top: 76px;">
        {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
    
    <footer>
        <p>Built with Django + RAG Architecture | <span class="text-accent">AI ResumeXpert</span></p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
